<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Saver Cloud</title>
<link rel="manifest" href="manifest.json">
<style>
  body { background: #1e40af; color: #333; font-family: sans-serif; margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; }
  .card { background: white; width: 90%; max-width: 400px; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .tabs { display:flex; gap:10px; margin-bottom:-10px; z-index:1; }
  .tab { background:#e0e7ff; padding:8px 20px; border-radius:10px 10px 0 0; text-decoration:none; color:#333; font-weight:bold; }
  .tab.active { background:white; }
  #progressBar { width:100%; height:15px; background:#eee; border-radius:10px; overflow:hidden; margin:10px 0; }
  #progress { height:100%; background:#22c55e; width:0%; transition:0.5s; }
  .btn { width:100%; padding:12px; border:none; border-radius:10px; color:white; font-weight:bold; margin-top:10px; cursor:pointer; }
  .btn-blue { background:#3b82f6; } .btn-green { background:#16a34a; } .btn-red { background:#ef4444; margin-top:20px; }
  #goalCompleteBox { display:none; background:#fef3c7; border:2px solid #f59e0b; padding:15px; border-radius:10px; text-align:center; }
</style>
</head>
<body>

<h2 style="color:white;">💰 Smart Saver Cloud</h2>

<div class="tabs">
  <a href="index.html" class="tab active">🏠 Home</a>
  <a href="add.html" class="tab">➕ Add</a>
  <a href="analytics.html" class="tab">📊 Analytics</a>
</div>

<div class="card">
  <h3>Hi, Saver! 👋</h3>
  <p id="budgetText">Budget: ₹0 | Spent: ₹0</p>
  <div id="progressBar"><div id="progress"></div></div>
  <p id="savedText">💵 Saved: ₹0</p>
  <p id="msg" style="background:#dcfce7; padding:8px; border-radius:5px;"></p>

  <!-- GOAL COMPLETE BOX - Shows only when goal done -->
  <div id="goalCompleteBox">
    <h2>🎉 Goal Completed!</h2>
    <p id="completeMsg"></p>
    <input type="text" id="newGoalName" placeholder="Enter New Goal (e.g., Laptop)" style="width:90%; padding:8px; margin:5px;">
    <input type="number" id="newGoalAmount" placeholder="New Goal Amount (₹)" style="width:90%; padding:8px; margin:5px;">
    <button class="btn btn-blue" onclick="restartGoal()">🚀 Start New Goal</button>
  </div>
</div>

<div class="card">
  <h4>Quick Actions</h4>
  <a href="add.html"><button class="btn btn-blue">➕ Add New Expense</button></a>
  <a href="analytics.html"><button class="btn btn-green">📊 View Analysis & Saving Tips</button></a>
</div>

<div class="card">
  <p id="goalText">🎯 My Goal: Not set yet</p>
  <p id="autoClearInfo" style="font-size:12px; color:gray;"></p>
</div>

<script>
// ========== 1. AUTO CLEAR EVERY MONTH START ==========
(function autoClearMonthly(){
  const now = new Date();
  const currentMonthKey = `${now.getMonth()}-${now.getFullYear()}`;
  const lastCleared = localStorage.getItem('lastClearedMonth');

  if(lastCleared !== currentMonthKey){
    // New month - clear only expenses, keep budget & goal
    localStorage.removeItem('expenses');
    localStorage.setItem('lastClearedMonth', currentMonthKey);
    localStorage.setItem('lastAutoClearDate', now.toLocaleDateString());
    console.log("Auto cleared for new month");
  }
  const lastDate = localStorage.getItem('lastAutoClearDate');
  if(lastDate) document.getElementById('autoClearInfo').innerText = `Auto-cleared on: ${lastDate} (Every 1st of month)`;
})();
// ========== AUTO CLEAR END ==========

// ========== 2. LOAD DATA ==========
let budget = parseInt(localStorage.getItem('budget') || 0);
let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
let goalName = localStorage.getItem('goalName') || 'house';
let goalAmount = parseInt(localStorage.getItem('goalAmount') || 1000);

let totalSpent = expenses.reduce((sum, e) => sum + parseInt(e.amount || 0), 0);
let saved = budget - totalSpent;
if(saved < 0) saved = 0;

// Update UI
document.getElementById('budgetText').innerText = `Budget: ₹${budget} | Spent: ₹${totalSpent}`;
document.getElementById('savedText').innerText = `💵 Saved: ₹${saved}`;
document.getElementById('goalText').innerText = `🎯 My Goal: ${goalName} (₹${goalAmount})`;

let percent = budget > 0 ? Math.min((totalSpent / budget) * 100, 100) : 0;
document.getElementById('progress').style.width = percent + "%";

if(totalSpent > budget && budget > 0){
  document.getElementById('msg').innerText = "🚨 Over budget! Stop spending!";
  document.getElementById('msg').style.background = "#fecaca";
} else {
  document.getElementById('msg').innerText = "✅ You are on track!";
}

// ========== 3. GOAL COMPLETION CHECK ==========
if(goalAmount > 0 && saved >= goalAmount){
  document.getElementById('goalCompleteBox').style.display = "block";
  document.getElementById('completeMsg').innerText = `You saved ₹${saved} and completed your goal "${goalName}" of ₹${goalAmount}!`;
  document.getElementById('progress').style.background = "gold";
}

function restartGoal(){
  const newName = document.getElementById('newGoalName').value;
  const newAmount = document.getElementById('newGoalAmount').value;
  if(!newName || !newAmount){
    alert("Please enter new goal name and amount");
    return;
  }
  // Save new goal and reset savings cycle
  localStorage.setItem('goalName', newName);
  localStorage.setItem('goalAmount', newAmount);
  localStorage.removeItem('expenses'); // Start fresh for new goal
  localStorage.setItem('budget', 0); // Optional: ask user to set new budget
  alert(`🎉 New Goal "${newName}" started! Set your new budget now.`);
  location.href = "index.html";
}

// Register Service Worker
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
